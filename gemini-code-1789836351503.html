<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>French Natural & Conversational Translator</title>
  <style>
    :root {
      --bg-color: #f7f4ee;           /* Warm off-white / light beige */
      --card-bg: #2e3029;          /* Deep dark charcoal grey */
      --accent-olive: #586445;     /* Deep olive green */
      --olive-light: #7a8a63;       /* Lighter olive green */
      --accent-sage: #a3b18a;      /* Soft sage accent */
      --output-bg: #eae0d5;        /* Soft warm beige card */
      --text-dark: #252422;        /* Dark charcoal text */
      --text-light: #f7f4ee;       /* Light text on dark bg */
      --text-muted: #b0ada8;       /* Muted text on dark bg */
      --border-color: #3f4239;     /* Subtle border inside dark cards */
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--text-dark);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 0.5rem;
    }

    header p {
      color: #605c56;
      font-size: 1rem;
    }

    .card {
      background-color: var(--card-bg);
      color: var(--text-light);
      border-radius: var(--radius);
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    /* Controls Bar */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: center;
    }

    @media (max-width: 600px) {
      .controls-grid {
        grid-template-columns: 1fr;
      }
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .control-group label {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent-sage);
    }

    select, input[type="text"] {
      background-color: #21231e;
      color: var(--text-light);
      border: 1px solid var(--border-color);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    select:focus, input[type="text"]:focus {
      border-color: var(--accent-sage);
    }

    /* Custom Toggle Switch for Tone */
    .tone-toggle-container {
      display: flex;
      background-color: #21231e;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px;
    }

    .tone-option {
      flex: 1;
      text-align: center;
      padding: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-muted);
    }

    .tone-option.active {
      background-color: var(--accent-olive);
      color: #ffffff;
      font-weight: 600;
    }

    /* Translation Area */
    .translation-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }

    @media (max-width: 700px) {
      .translation-grid {
        grid-template-columns: 1fr;
      }
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent-sage);
    }

    .text-box-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    textarea {
      width: 100%;
      height: 180px;
      background-color: #21231e;
      color: var(--text-light);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      font-size: 1.05rem;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--accent-sage);
    }

    textarea::placeholder {
      color: #6a6863;
    }

    .clear-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(255,255,255,0.1);
      border: none;
      color: var(--text-muted);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
    }

    .clear-btn:hover {
      background: rgba(255,255,255,0.2);
      color: #fff;
    }

    .char-count {
      align-self: flex-end;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Output Box Styling */
    .output-box {
      width: 100%;
      height: 180px;
      background-color: var(--output-bg);
      color: var(--text-dark);
      border-radius: 10px;
      padding: 1rem;
      font-size: 1.05rem;
      line-height: 1.5;
      overflow-y: auto;
      position: relative;
      word-break: break-word;
    }

    .output-placeholder {
      color: #8c8378;
      font-style: italic;
    }

    .actions-bar {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }

    .copy-btn {
      background-color: var(--accent-olive);
      color: #ffffff;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .copy-btn:hover {
      background-color: var(--olive-light);
    }

    /* Loading Indicator */
    .loading-status {
      font-size: 0.8rem;
      color: var(--accent-sage);
      font-style: italic;
      display: none;
    }

    .loading-status.active {
      display: inline;
    }

    /* Explanation Card */
    .explanation-card {
      background-color: #21231e;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 1rem;
      margin-top: 1rem;
      display: none;
    }

    .explanation-card.visible {
      display: block;
    }

    .explanation-title {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--accent-sage);
      margin-bottom: 0.4rem;
    }

    .explanation-text {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* API Key Modal/Bar */
    .api-settings {
      margin-top: 1rem;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,0.15);
      padding: 10px 14px;
      border-radius: 8px;
    }

    .api-settings input {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .api-settings button {
      background: var(--accent-olive);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .api-settings button:hover {
      background: var(--olive-light);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><span>🇫🇷</span> French Natural Translator</h1>
      <p>Conversational, natural translations — you type, it translates.</p>
    </header>

    <div class="card">
      <!-- Controls -->
      <div class="controls-grid">
        <div class="control-group">
          <label for="direction">Direction</label>
          <select id="direction" onchange="triggerTranslation()">
            <option value="en-fr">English → French</option>
            <option value="fr-en">French → English</option>
            <option value="fr-fr">French → French Rephrase</option>
          </select>
        </div>

        <div class="control-group">
          <label>Tone</label>
          <div class="tone-toggle-container">
            <div id="tone-polite" class="tone-option" onclick="setTone('polite')">Polite / Formal</div>
            <div id="tone-casual" class="tone-option active" onclick="setTone('casual')">Casual / Natural</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Translator Grid -->
    <div class="card">
      <div class="translation-grid">
        <!-- Input Area -->
        <div class="text-box-wrapper">
          <div class="box-header">
            <span>INPUT TEXT</span>
            <span id="loading-indicator" class="loading-status">Translating...</span>
          </div>
          <textarea id="inputText" placeholder="Type here to translate in real-time..." oninput="onInputChanged()"></textarea>
          <button class="clear-btn" onclick="clearText()" title="Clear">✕</button>
          <span id="charCount" class="char-count">0 characters</span>
        </div>

        <!-- Output Area -->
        <div class="text-box-wrapper">
          <div class="box-header">
            <span>TRANSLATION</span>
          </div>
          <div id="outputText" class="output-box">
            <span class="output-placeholder">Translation will appear here instantly...</span>
          </div>
          <div class="actions-bar">
            <button class="copy-btn" onclick="copyTranslation()">Copy</button>
          </div>
        </div>
      </div>

      <!-- Nuance Explanation Box -->
      <div id="explanationBox" class="explanation-card">
        <div class="explanation-title">💡 Nuance & Context Notes</div>
        <div id="explanationText" class="explanation-text"></div>
      </div>

      <!-- API Key Setup (Stored locally in user browser) -->
      <div class="api-settings">
        <span>🔑 Gemini API Key:</span>
        <input type="password" id="apiKeyInput" placeholder="Enter key..." />
        <button onclick="saveApiKey()">Save</button>
      </div>
    </div>
  </div>

  <script>
    let currentTone = 'casual';
    let debounceTimer = null;

    // Load stored API Key if present
    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (savedKey) {
        document.getElementById('apiKeyInput').value = savedKey;
      }
    };

    function saveApiKey() {
      const key = document.getElementById('apiKeyInput').value.trim();
      localStorage.setItem('gemini_api_key', key);
      alert('API key saved locally in browser!');
      triggerTranslation();
    }

    function setTone(tone) {
      currentTone = tone;
      document.getElementById('tone-polite').classList.toggle('active', tone === 'polite');
      document.getElementById('tone-casual').classList.toggle('active', tone === 'casual');
      triggerTranslation();
    }

    function onInputChanged() {
      const text = document.getElementById('inputText').value;
      document.getElementById('charCount').innerText = `${text.length} characters`;

      clearTimeout(debounceTimer);
      if (!text.trim()) {
        document.getElementById('outputText').innerHTML = '<span class="output-placeholder">Translation will appear here instantly...</span>';
        document.getElementById('explanationBox').classList.remove('visible');
        document.getElementById('loading-indicator').classList.remove('active');
        return;
      }

      document.getElementById('loading-indicator').classList.add('active');
      // Debounce API calls by 500ms while typing
      debounceTimer = setTimeout(() => {
        triggerTranslation();
      }, 500);
    }

    async function triggerTranslation() {
      const text = document.getElementById('inputText').value.trim();
      const direction = document.getElementById('direction').value;
      const apiKey = localStorage.getItem('gemini_api_key') || document.getElementById('apiKeyInput').value.trim();

      if (!text) return;

      if (!apiKey) {
        document.getElementById('outputText').innerText = 'Please enter your Gemini API key in the settings field below.';
        document.getElementById('loading-indicator').classList.remove('active');
        return;
      }

      let systemPrompt = "";
      if (direction === 'en-fr') {
        if (currentTone === 'casual') {
          systemPrompt = "Translate the following English text into natural, modern, conversational everyday French (argot / spoken French). Avoid stiff textbook grammar. Use 'tu'.";
        } else {
          systemPrompt = "Translate the following English text into polite, formal, and respectful French. Use 'vous' where appropriate.";
        }
      } else if (direction === 'fr-en') {
        if (currentTone === 'casual') {
          systemPrompt = "Translate the following French text into modern, casual spoken English.";
        } else {
          systemPrompt = "Translate the following French text into clear, polite, formal English.";
        }
      } else { // fr-fr
        if (currentTone === 'casual') {
          systemPrompt = "Rephrase this standard French sentence into casual, spoken modern French slang or daily vocabulary.";
        } else {
          systemPrompt = "Rephrase this informal French sentence into professional, formal, and grammatically precise French.";
        }
      }

      const promptPayload = {
        contents: [
          {
            parts: [
              {
                text: `${systemPrompt}\n\nProvide the response in raw JSON format with two keys:\n- "translation": (string) the translation\n- "explanation": (string) a very brief 1-sentence explanation of phrasing choice or nuance if applicable.\n\nInput text: "${text}"`
              }
            ]
          }
        ],
        generationConfig: {
          response_mime_type: "application/json"
        }
      };

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(promptPayload)
        });

        const data = await response.json();
        const rawJsonStr = data.candidates[0].content.parts[0].text;
        const resultObj = JSON.parse(rawJsonStr);

        document.getElementById('outputText').innerText = resultObj.translation;

        if (resultObj.explanation && resultObj.explanation.trim()) {
          document.getElementById('explanationText').innerText = resultObj.explanation;
          document.getElementById('explanationBox').classList.add('visible');
        } else {
          document.getElementById('explanationBox').classList.remove('visible');
        }
      } catch (err) {
        console.error(err);
        document.getElementById('outputText').innerText = "Translation error. Check your API key or network connection.";
      } finally {
        document.getElementById('loading-indicator').classList.remove('active');
      }
    }

    function clearText() {
      document.getElementById('inputText').value = '';
      onInputChanged();
    }

    function copyTranslation() {
      const outputText = document.getElementById('outputText').innerText;
      if (outputText && !outputText.includes("Translation will appear here")) {
        navigator.clipboard.writeText(outputText);
        const btn = document.querySelector('.copy-btn');
        btn.innerText = 'Copied!';
        setTimeout(() => btn.innerText = 'Copy', 1500);
      }
    }
  </script>
</body>
</html>
